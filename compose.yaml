name: upcoming-local
services:
  app:
    build: &app-build
      context: .
      additional_contexts:
        frontend: ../upcoming-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://upcoming:upcoming_local@db:5432/upcoming
      FRONTEND_DIST_DIR: /app/public
      AUTH_MODE: local
      AUTH_BASE_URL: http://localhost:${APP_PORT:-3000}
      AUTH_SECRET: ${AUTH_SECRET:-upcoming-local-only-secret-change-for-public-use}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 10
    init: true
    restart: unless-stopped
  sync:
    profiles: [tools]
    build: *app-build
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://upcoming:upcoming_local@db:5432/upcoming
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
    command:
      [
        "sh",
        "-c",
        "node dist/migrate.js && exec node --use-env-proxy dist/sync.js",
      ]
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: "no"
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: upcoming
      POSTGRES_USER: upcoming
      POSTGRES_PASSWORD: upcoming_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upcoming -d upcoming"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
